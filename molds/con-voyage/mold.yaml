apiVersion: v1
kind: mold
name: con-voyage
version: 0.2.0
description: >-
  Con voyage — Gas Town orchestration. Deliver an issue, bead, or task
  description with a polecat team through nested implementation, a configurable
  roster of persona review lenses, CI, and human-review feedback loops, and
  never merge until a human does.
author:
  name: Kris Coleman
  url: https://github.com/kriscoleman
requires:
  ailloy: ">=0.6.17"
dependencies:
  # Persona review-lens charters (the roster in SKILL.md). Casting con-voyage
  # pulls these so the non-floor lenses are adoptable standalone. Resolves at
  # merge: con-voyage-personas (PR kc-clv) merges and tags first, then this mold.
  # The code+security floor charters stay inline in SKILL.md (graceful degradation).
  - mold: github.com/kriscoleman/foundry//molds/con-voyage-personas
    version: "^0.1.0"
