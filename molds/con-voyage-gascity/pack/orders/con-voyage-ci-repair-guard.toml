# con-voyage-ci-repair-guard — defense-in-depth author gate for
# con-voyage-ci-repair beads.
#
# A con-voyage-ci-repair bead can be minted for ANY PR by three different
# paths: the native [[github.pr_monitor]] (--create-repair-beads has no
# author filter), con-voyage-pr-watch.sh (already author-scoped), or a manual
# mis-sling. This order sweeps every open con-voyage-ci-repair bead the
# moment one is created and closes any whose PR is not authored by
# CV_PR_AUTHOR — BEFORE a worker can claim it and take any GitHub action.
#
# Event-triggered (bead.created) rather than a cooldown poll: the whole point
# is to win the race against a worker claim, so it fires as soon as a
# candidate bead exists instead of waiting out a poll interval. See
# assets/scripts/con-voyage-ci-repair-guard.sh for the sweep logic — it is a
# full open-bead sweep each time (not an event-payload diff), so it is
# naturally idempotent and self-healing regardless of which bead.created
# event triggered this run.
#
# A THIRD, independent gate (Step 0 in {target}.ci-repair.md) re-verifies the
# same invariant inside the workflow itself, in case this sweep loses the
# claim race. Belt and suspenders: this order is the fast path, Step 0 is the
# last line of defense.
#
# No auto-merge ever occurs from this order — it only ever closes a bead.

[order]
description = "Close con-voyage-ci-repair beads not authored by the operator, before a worker can act on them"
trigger = "event"
on = "bead.created"
exec = "$PACK_DIR/assets/scripts/con-voyage-ci-repair-guard.sh"

# Author-scope the guard explicitly. CV_PR_AUTHOR is the single GitHub login
# whose PRs the con-voyage-ci-repair workflow may act on (the allow-list) — the
# same knob as con-voyage-pr-watch.toml and the con-voyage-ci-repair formula's
# cv_pr_author default. Change this to the operator's own login if this pack
# is cast for a different user.
#
# CV_AUTHOR_GATE is the feature toggle over that allow-list:
#   enabled  (DEFAULT) — fail-closed author scoping: drop every con-voyage-ci-
#            repair bead whose PR is not authored by CV_PR_AUTHOR, and if
#            CV_PR_AUTHOR is empty/unresolved drop EVERYTHING (never work-all).
#   disabled — explicit opt-in: this guard becomes a no-op and every bead is
#            left for a worker regardless of author (native [[github.pr_monitor]]
#            "all PRs" parity). This is the ONLY value that yields work-all.
# Default enabled deliberately diverges from the native monitor's all-PRs
# default because an earlier unfiltered version got the operator removed from an
# org. Only the literal "disabled" (case-insensitive) turns the gate off; any
# other value stays enabled (fail closed on ambiguity). Keep in sync with
# cv_author_gate in con-voyage-ci-repair.formula.toml if you flip it.
[order.env]
CV_PR_AUTHOR = "kriscoleman"
CV_AUTHOR_GATE = "enabled"
