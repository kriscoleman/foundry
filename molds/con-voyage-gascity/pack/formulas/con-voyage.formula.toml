description = """
Con-voyage delivery formula — full escort review for a branch before it lands.

Inherits the acceptance, test-evidence, and simplicity lanes from build-basic-review
and adds two always-on floor lanes (security + native-language code review) plus an
optional roster of up to twelve persona lenses controlled by per-lens boolean vars.

Never auto-merges. The branch is pushed and a PR opened, but a human must land it.
"""
formula = "con-voyage"
type = "expansion"
version = 1
contract = "graph.v2"

[vars]
[vars.push]
description = "Push the work branch to the remote. Set true (default) to push the branch so a PR can be opened. Set false to hold locally."
default = "true"

[vars.open_pr]
description = "Open a pull request after review passes and push succeeds. Always true for con-voyage."
default = "true"

[vars.code_lens]
description = "Run-target for the native-language code review floor lane. Override to select a different language principal engineer or the generic code reviewer."
default = "con-voyage.cv-go-principal-engineer"

[vars.implementation_target]
description = "Role target used to apply con-voyage review findings, and to run the initial build phase's TDD round when the target bead has no pre-built branch yet."
default = "gc.implementation-worker"

# ---------------------------------------------------------------------------
# Build phase — folds the do-work build in as con-voyage's own first phase
# (fk-9aunv: "implement-then-escort — one-sling journey"), so a single sling
# on a FRESH work bead builds, reviews, and publishes in one journey instead
# of requiring a separate `gc sling ... --on do-work` first. Automatically
# short-circuits when the target bead already has a pre-built branch (an
# existing source-anchor work_dir with commits ahead of base) — backward
# compatible with the existing pre-built-branch con-voyage path. The
# short-circuit decision is a RUNTIME fact (does this bead already have a
# branch?), not a sling-time var, so both steps below always run; prepare-build
# resolves/creates the worktree and records whether it was already built, and
# build itself either verifies the existing evidence (short-circuit) or runs
# the first TDD round (fresh).
# ---------------------------------------------------------------------------

[[template]]
id = "{target}.prepare-build"
title = "Prepare con-voyage build worktree"
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/con-voyage/{target}.prepare-build.md"

[[template]]
id = "{target}.build"
title = "Con-voyage: initial implementation (TDD)"
needs = ["{target}.prepare-build"]
metadata = { "gc.run_target" = "{implementation_target}", "gc.build.artifact_schema" = "gc.build.implementation-summary.v1", "gc.build.artifact_path_keys" = "gc.implementation.summary_path,gc.build.implementation_summary_path,gc.var.summary_path" }
description_file = "../assets/workflows/con-voyage/{target}.build.md"

[template.check]
max_attempts = 3

[template.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

# ---------------------------------------------------------------------------
# Setup step — gathers review context (reuses the build-basic-review pattern)
# ---------------------------------------------------------------------------

[[template]]
id = "{target}.setup-con-voyage-review"
title = "Prepare con-voyage review context"
needs = ["{target}.build"]
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/con-voyage/{target}.setup-con-voyage-review.md"

# ---------------------------------------------------------------------------
# Review loop — children fan out and synthesize, loop until approved
#
# Review-lane liveness (fk-loo1 FIX-F): review lenses are pool-managed and
# only ever wake on a nudge. On a slow-startup (large) repo, a pool churn
# cycle can drain a still-starting lens roster before it claims its lane
# bead, leaving that lane open+unassigned forever with nothing to re-drive
# it. The three vars below tune the in-loop claim-verification/re-dispatch
# block documented in the review-loop's own description file; the
# independent con-voyage-review-watchdog order (con-voyage-review-watchdog.
# toml) is the periodic defense-in-depth backstop for the same problem.
# ---------------------------------------------------------------------------

[vars.cv_lens_claim_seconds]
description = """
Seconds a review-lane bead may sit open+unassigned before the review loop
re-arms delivery: touch the bead (bump updated_at, re-firing core
nudge-on-route) and nudge a live pool session, or re-route immediately if the
routed lens pool has no live session at all. Default 300s (5 minutes) covers
the ~2-minute worst-case lens wake time observed on a large-repo cold start
(fk-loo1 dogfooding) while staying comfortably under
con-voyage-review-watchdog's own 10-minute stall threshold, so the faster
in-loop check is normally the one that recovers a stalled lane.
"""
default = "300"

[vars.cv_lens_max_redispatch]
description = """
Bounded re-dispatch attempts per stalled review lane before the review loop
escalates to cv_lens_escalate_target via mail and stops re-dispatching that
lane. Mirrors CV_MAX_ATTEMPTS in con-voyage-repair-watchdog.toml.
"""
default = "3"

[vars.cv_lens_escalate_target]
description = """
Mail recipient when a review lane exhausts cv_lens_max_redispatch. Defaults
to the reserved `human` alias.
"""
default = "human"

[[template]]
id = "{target}.con-voyage-review-loop"
title = "Run con-voyage review until approved"
needs = ["{target}.setup-con-voyage-review"]
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/con-voyage/{target}.con-voyage-review-loop.md"

[template.check]
max_attempts = 8

[template.check.check]
mode = "exec"
path = ".gc/scripts/checks/implementation-review-approved.sh"
timeout = "10m"

# ---------------------------------------------------------------------------
# Floor lane: acceptance review (inherited from build-basic-review)
# ---------------------------------------------------------------------------

[[template.children]]
id = "{target}.acceptance-review"
title = "Con-voyage: acceptance and correctness"
metadata = { "gc.run_target" = "gc.implementation-reviewer" }
description_file = "../assets/workflows/con-voyage/{target}.acceptance-review.md"

# ---------------------------------------------------------------------------
# Floor lane: test-evidence review (inherited from build-basic-review)
# ---------------------------------------------------------------------------

[[template.children]]
id = "{target}.test-evidence-review"
title = "Con-voyage: test evidence"
metadata = { "gc.run_target" = "gc.gap-analyst" }
description_file = "../assets/workflows/con-voyage/{target}.test-evidence-review.md"

# ---------------------------------------------------------------------------
# Floor lane: simplicity review (inherited from build-basic-review)
# ---------------------------------------------------------------------------

[[template.children]]
id = "{target}.simplicity-review"
title = "Con-voyage: simplicity and maintainability"
metadata = { "gc.run_target" = "gc.design-implementation-reviewer" }
description_file = "../assets/workflows/con-voyage/{target}.simplicity-review.md"

# ---------------------------------------------------------------------------
# Floor lane: security review (always active)
# ---------------------------------------------------------------------------

[[template.children]]
id = "{target}.security-review"
title = "Con-voyage: security review"
metadata = { "gc.run_target" = "con-voyage.cv-security-reviewer" }
description_file = "../assets/workflows/con-voyage/{target}.security-review.md"

# ---------------------------------------------------------------------------
# Floor lane: native-language code review (always active; default = Go PE)
# ---------------------------------------------------------------------------

[[template.children]]
id = "{target}.code-review"
title = "Con-voyage: code review (native-language)"
metadata = { "gc.run_target" = "{code_lens}" }
description_file = "../assets/workflows/con-voyage/{target}.code-review.md"

# ---------------------------------------------------------------------------
# Roster lanes — conditional on per-lens boolean vars (default = false / off)
#
# Mechanism: graph.v2 compile-time condition field using {{var}} presence test.
# When enable_<lens> = "false" (falsy), gc removes the lane from the recipe
# along with its dependency edges before cooking. No sling-time workaround needed.
#
# Limitation: graph.v2 condition expressions support presence ({{var}}) and
# equality ({{var}} == value) but NOT "contains" membership testing. A single
# `lenses` string var cannot be used to gate individual lanes. The design uses
# one boolean var per lens. The facilitator sets --set enable_<lens>=true at
# sling time for each desired lane. The `lenses` var is informational only.
# ---------------------------------------------------------------------------

[vars.enable_product_owner]
description = "Enable product-owner roster lens."
default = "false"

[[template.children]]
id = "{target}.product-owner-review"
title = "Con-voyage: product-owner review"
condition = """{{enable_product_owner}}"""
metadata = { "gc.run_target" = "con-voyage.cv-product-owner" }
description_file = "../assets/workflows/con-voyage/{target}.product-owner-review.md"

[vars.enable_founder_cto]
description = "Enable founder-CTO roster lens."
default = "false"

[[template.children]]
id = "{target}.founder-cto-review"
title = "Con-voyage: founder-CTO review"
condition = """{{enable_founder_cto}}"""
metadata = { "gc.run_target" = "con-voyage.cv-founder-cto" }
description_file = "../assets/workflows/con-voyage/{target}.founder-cto-review.md"

[vars.enable_dev_ex]
description = "Enable dev-ex reviewer roster lens."
default = "false"

[[template.children]]
id = "{target}.dev-ex-review"
title = "Con-voyage: developer experience review"
condition = """{{enable_dev_ex}}"""
metadata = { "gc.run_target" = "con-voyage.cv-dev-ex-reviewer" }
description_file = "../assets/workflows/con-voyage/{target}.dev-ex-review.md"

[vars.enable_standards_janitor]
description = "Enable standards-janitor roster lens."
default = "false"

[[template.children]]
id = "{target}.standards-janitor-review"
title = "Con-voyage: standards and conventions review"
condition = """{{enable_standards_janitor}}"""
metadata = { "gc.run_target" = "con-voyage.cv-standards-janitor" }
description_file = "../assets/workflows/con-voyage/{target}.standards-janitor-review.md"

[vars.enable_qa_test]
description = "Enable QA / test-engineer roster lens."
default = "false"

[[template.children]]
id = "{target}.qa-test-review"
title = "Con-voyage: QA and test-engineering review"
condition = """{{enable_qa_test}}"""
metadata = { "gc.run_target" = "con-voyage.cv-qa-test-engineer" }
description_file = "../assets/workflows/con-voyage/{target}.qa-test-review.md"

[vars.enable_sre]
description = "Enable SRE reliability roster lens."
default = "false"

[[template.children]]
id = "{target}.sre-review"
title = "Con-voyage: SRE reliability review"
condition = """{{enable_sre}}"""
metadata = { "gc.run_target" = "con-voyage.cv-sre-reliability" }
description_file = "../assets/workflows/con-voyage/{target}.sre-review.md"

[vars.enable_design_ux]
description = "Enable design/UX roster lens."
default = "false"

[[template.children]]
id = "{target}.design-ux-review"
title = "Con-voyage: design and UX review"
condition = """{{enable_design_ux}}"""
metadata = { "gc.run_target" = "con-voyage.cv-design-ux" }
description_file = "../assets/workflows/con-voyage/{target}.design-ux-review.md"

[vars.enable_documentation]
description = "Enable documentation roster lens."
default = "false"

[[template.children]]
id = "{target}.documentation-review"
title = "Con-voyage: documentation review"
condition = """{{enable_documentation}}"""
metadata = { "gc.run_target" = "con-voyage.cv-documentation" }
description_file = "../assets/workflows/con-voyage/{target}.documentation-review.md"

[vars.enable_marketing]
description = "Enable marketing roster lens."
default = "false"

[[template.children]]
id = "{target}.marketing-review"
title = "Con-voyage: marketing review"
condition = """{{enable_marketing}}"""
metadata = { "gc.run_target" = "con-voyage.cv-marketing" }
description_file = "../assets/workflows/con-voyage/{target}.marketing-review.md"

[vars.enable_api_platform]
description = "Enable API/platform contract roster lens."
default = "false"

[[template.children]]
id = "{target}.api-platform-review"
title = "Con-voyage: API and platform contract review"
condition = """{{enable_api_platform}}"""
metadata = { "gc.run_target" = "con-voyage.cv-api-platform-contract" }
description_file = "../assets/workflows/con-voyage/{target}.api-platform-review.md"

[vars.enable_compliance]
description = "Enable compliance/privacy roster lens."
default = "false"

[[template.children]]
id = "{target}.compliance-review"
title = "Con-voyage: compliance and privacy review"
condition = """{{enable_compliance}}"""
metadata = { "gc.run_target" = "con-voyage.cv-compliance-privacy" }
description_file = "../assets/workflows/con-voyage/{target}.compliance-review.md"

[vars.enable_data_db]
description = "Enable data/database engineer roster lens."
default = "false"

[[template.children]]
id = "{target}.data-db-review"
title = "Con-voyage: data and database review"
condition = """{{enable_data_db}}"""
metadata = { "gc.run_target" = "con-voyage.cv-data-db-engineer" }
description_file = "../assets/workflows/con-voyage/{target}.data-db-review.md"

# ---------------------------------------------------------------------------
# Fan-in: synthesize all active review lanes
# ---------------------------------------------------------------------------

[[template.children]]
id = "{target}.synthesize-review"
title = "Synthesize con-voyage review"
needs = [
  "{target}.acceptance-review",
  "{target}.test-evidence-review",
  "{target}.simplicity-review",
  "{target}.security-review",
  "{target}.code-review",
  "{target}.product-owner-review",
  "{target}.founder-cto-review",
  "{target}.dev-ex-review",
  "{target}.standards-janitor-review",
  "{target}.qa-test-review",
  "{target}.sre-review",
  "{target}.design-ux-review",
  "{target}.documentation-review",
  "{target}.marketing-review",
  "{target}.api-platform-review",
  "{target}.compliance-review",
  "{target}.data-db-review",
]
metadata = { "gc.run_target" = "gc.review-synthesizer" }
description_file = "../assets/workflows/con-voyage/{target}.synthesize-review.md"

# ---------------------------------------------------------------------------
# Apply findings, then loop back if any BLOCKING finding remains
# ---------------------------------------------------------------------------

[[template.children]]
id = "{target}.apply-review-findings"
title = "Apply con-voyage review findings"
needs = ["{target}.synthesize-review"]
metadata = { "gc.run_target" = "{implementation_target}", "gc.continuation_group" = "con-voyage-review-fixes" }
description_file = "../assets/workflows/con-voyage/{target}.apply-review-findings.md"

# ---------------------------------------------------------------------------
# Publish step — pushes the work branch and opens the PR (never auto-merges)
# ---------------------------------------------------------------------------

[[template]]
id = "{target}.publish"
title = "Publish con-voyage result (push branch + open PR)"
needs = ["{target}.con-voyage-review-loop"]
metadata = { "gc.run_target" = "gc.publisher" }
description_file = "../assets/workflows/con-voyage/{target}.publish.md"

# ---------------------------------------------------------------------------
# Finalize step — writes the build artifact, checked for validity
# ---------------------------------------------------------------------------

[[template]]
id = "{target}"
title = "Finalize con-voyage review"
needs = ["{target}.publish"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.review.v1", "gc.build.artifact_path_keys" = "gc.build.review_report_path" }
description_file = "../assets/workflows/con-voyage/{target}.md"

[template.check]
max_attempts = 3

[template.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
