apiVersion: v1
kind: foundry-index
name: kriscoleman-foundry
description: "Kris Coleman's Ailloy foundry — Gas Town and Claude Code workflow molds"
author:
  name: Kris Coleman
  url: https://github.com/kriscoleman
molds:
  - name: con-voyage-gastown
    source: github.com/kriscoleman/foundry//molds/con-voyage-gastown
    description: "Gas Town (gt) orchestration: deliver an issue with a polecat team through review, CI, and human feedback loops until a human merges."
    tags: ["ailloy-mold", "gas-town", "claude", "orchestration", "workflows"]
  - name: con-voyage-gascity
    source: github.com/kriscoleman/foundry//molds/con-voyage-gascity
    description: "Gas City-native con-voyage: casts a chief-of-staff + reviewer lenses + delivery loop into a gas city."
    tags: ["ailloy-mold", "gas-city", "claude", "orchestration", "workflows"]
  - name: engineering-planning
    source: github.com/kriscoleman/foundry//molds/engineering-planning
    description: "Conversational Agile-Coach planner: interview stakeholders, brainstorm work items, refine them into create-issue-format GitHub issues with epic/sub-issue decomposition, gate on consensus, then create the issues and optionally track them as a Projects iteration."
    tags: ["ailloy-mold", "claude", "planning", "agile", "github-issues", "workflows"]
  - name: con-voyage-personas
    source: github.com/kriscoleman/foundry//molds/con-voyage-personas
    description: "The con-voyage review crew in one cast — aggregate mold pulling in all fifteen reusable reviewer/engineering persona molds across strategy, product, design, engineering, quality, operations, security, compliance, data, and communication."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage"]
  - name: founder-cto
    source: github.com/kriscoleman/foundry//molds/founder-cto
    description: "Founder/CTO strategic lens agent: executive ship/no-ship judgment on a change or proposal — vision fit, business risk, ROI, opportunity cost. Con-voyage reviewer or standalone advisor."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage"]
  - name: product-owner
    source: github.com/kriscoleman/foundry//molds/product-owner
    description: "Product-owner appetite-and-worth-it lens agent: usability for the buyer and their customers, UX/DevEx, and holistic docs coverage. Con-voyage reviewer or standalone advisor."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage"]
  - name: go-principal-engineer
    source: github.com/kriscoleman/foundry//molds/go-principal-engineer
    description: "Principal Go engineer lens agent: idioms, fail-loud wrapped error handling, safe concurrency, test quality, SOLID/DRY/KISS/YAGNI. Con-voyage code reviewer or standalone Go engineer."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "go"]
  - name: frontend-principal-engineer
    source: github.com/kriscoleman/foundry//molds/frontend-principal-engineer
    description: "Principal frontend engineer lens agent: accessibility, component/state design, performance, design-system fit. Con-voyage code reviewer or standalone frontend engineer."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "frontend"]
  - name: security-reviewer
    source: github.com/kriscoleman/foundry//molds/security-reviewer
    description: "Application security lens agent: injection, authn/authz, secret handling, supply-chain, least-privilege, input validation. Con-voyage security reviewer or standalone auditor."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "security"]
  - name: standards-janitor
    source: github.com/kriscoleman/foundry//molds/standards-janitor
    description: "Standards and consistency lens agent: conventions/naming, lint/format, dead code, DRY across the diff, docs hygiene. Con-voyage reviewer or standalone standards pass."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage"]
  - name: dev-ex-reviewer
    source: github.com/kriscoleman/foundry//molds/dev-ex-reviewer
    description: "Developer-experience adoption lens agent: error messages, sane defaults, discoverability, copy-paste onboarding. Con-voyage reviewer or standalone DevEx critique."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "devex"]
  - name: marketing
    source: github.com/kriscoleman/foundry//molds/marketing
    description: "Marketing and positioning lens agent: positioning, messaging, naming, value-prop clarity, launch/GTM readiness. Con-voyage reviewer or standalone advisor."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "marketing"]
  - name: design-ux
    source: github.com/kriscoleman/foundry//molds/design-ux
    description: "Design/UX lens agent: interaction and visual design, UX flows, information architecture, design-system consistency. Con-voyage reviewer or standalone advisor."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "design", "ux"]
  - name: documentation
    source: github.com/kriscoleman/foundry//molds/documentation
    description: "Technical-writer documentation lens agent: prose quality, docs structure and standards, clarity, grammar, completeness (Strunk & White). Con-voyage reviewer or standalone editor."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "docs"]
  - name: qa-test-engineer
    source: github.com/kriscoleman/foundry//molds/qa-test-engineer
    description: "QA test-engineering lens agent: test strategy, coverage, edge cases, regression risk. Con-voyage reviewer or standalone QA advisor."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "qa", "testing"]
  - name: sre-reliability
    source: github.com/kriscoleman/foundry//molds/sre-reliability
    description: "SRE reliability lens agent: observability, failure modes, rollout/rollback safety, SLOs. Con-voyage reviewer or standalone SRE advisor."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "sre", "reliability"]
  - name: api-platform-contract
    source: github.com/kriscoleman/foundry//molds/api-platform-contract
    description: "API/platform contract lens agent: API design, backward compatibility, versioning, contract stability. Con-voyage reviewer or standalone API architect."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "api", "platform"]
  - name: compliance-privacy
    source: github.com/kriscoleman/foundry//molds/compliance-privacy
    description: "Compliance and privacy lens agent: data handling, PII, SOC 2/enterprise compliance, auditability. Con-voyage reviewer or standalone governance advisor."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "compliance", "privacy"]
  - name: data-db-engineer
    source: github.com/kriscoleman/foundry//molds/data-db-engineer
    description: "Data/database engineering lens agent: schema and migration safety, SQL correctness, query performance. Con-voyage reviewer or standalone data engineer."
    tags: ["ailloy-mold", "claude", "opencode", "agents", "review", "personas", "con-voyage", "data", "database"]
